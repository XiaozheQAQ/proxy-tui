name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: windows named pipe ipc
        if: runner.os == 'Windows'
        run: go test -race ./internal/ipc ./internal/supervisor -count=1
      - name: native unix peer ipc
        if: runner.os != 'Windows'
        run: go test -race ./internal/ipc ./internal/supervisor -count=1

  release-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/proxytui/proxy-tui/internal/app.Version=${VERSION#v}" \
            -o proxy-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/proxy
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: proxy-${{ matrix.goos }}-${{ matrix.goarch }}
